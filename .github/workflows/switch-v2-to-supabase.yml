name: Switch V2 entrypoint to Supabase

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch-v2-to-supabase.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pd_app_v2.py with Supabase entrypoint
        run: |
          cat > pd_app_v2.py <<'PY'
          import pd_app_supabase  # Streamlit entrypoint wrapper
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pd_app_v2.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use Supabase app for V2 entrypoint"
            git push
          fi
