services:
  postgres:
    image: postgres:16-alpine
    container_name: storylab-postgres
    environment:
      POSTGRES_USER: storylab
      POSTGRES_PASSWORD: storylab
      POSTGRES_DB: storylab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storylab -d storylab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storylab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
